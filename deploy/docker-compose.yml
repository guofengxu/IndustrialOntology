# Full stack (mongo + keycloak + app), built from the repository root.
#   docker compose -f deploy/docker-compose.yml up -d --build
# For local evaluation only: Keycloak runs in dev mode and imports the dev realm, whose users have their names as
# passwords, and "admin" holds the realm role webprotege-admin, which the application maps to SystemAdmin
# (docs/01 §6). A real deployment needs its own realm export without these users and real Keycloak secrets.
name: industrial-ontology

services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      # Tokens carry the browser-facing issuer; the app fetches keys over the compose network.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      WP_MONGODB_URI: mongodb://mongo:27017/webprotege
      WP_OIDC_ISSUER: http://localhost:8180/realms/webprotege
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/webprotege/protocol/openid-connect/certs
      WP_DATA_DIR: /srv/webprotege
    ports:
      - "8080:8080"
    volumes:
      - app-data:/srv/webprotege

volumes:
  mongo-data:
  app-data:
