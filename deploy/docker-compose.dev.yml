# Local infrastructure for development (docs/00 §9).
#   docker compose -f deploy/docker-compose.dev.yml up -d
# Then: mvn -pl wp-server spring-boot:run -Dspring-boot.run.profiles=dev
#       pnpm -C wp-web dev
name: industrial-ontology-dev

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"   # issuer: http://localhost:8180/realms/webprotege
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

volumes:
  mongo-data:
