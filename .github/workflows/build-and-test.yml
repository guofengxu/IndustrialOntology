name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (format → checkstyle → test → build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Format
        run: ./mvnw -B -ntp spotless:check
      - name: Checkstyle
        run: ./mvnw -B -ntp checkstyle:check
      - name: Test
        run: ./mvnw -B -ntp test
      - name: Build
        run: ./mvnw -B -ntp verify

  web:
    name: web (lint → typecheck → test → build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wp-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: wp-web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: wp-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
